; Фото блюд: форма принимает до 8 МБ (DishRequest), у PHP по умолчанию — только 2 МБ.
; Вместе с этими значениями держать client_max_body_size в docker/nginx/conf.d/default.conf.
upload_max_filesize = 10M
post_max_size = 12M

; Конвертация в WebP разворачивает снимок в память (~4 байта на пиксель):
; при 128 МБ фото с камеры на 48 Мп и больше обрывали задачу в очереди.
memory_limit = 384M
