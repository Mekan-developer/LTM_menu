# Продакшен: попадает в образ nginx (docker/app/Dockerfile, этап web).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /var/www/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # Вместе с docker/php/uploads.ini: фото блюда — до 8 МБ.
    client_max_body_size 10m;

    # DNS Docker: после пересоздания контейнеров Nginx находит новый адрес без перезапуска.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket (Laravel Reverb) идёт через тот же домен и порт.
    location /app/ {
        set $reverb http://reverb:8080;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Выполняется только точка входа Laravel; другие .php-файлы не отдаются и не запускаются.
    location = /index.php {
        set $app app:9000;
        fastcgi_pass $app;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
