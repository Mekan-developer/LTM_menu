# Общая часть для разработки и продакшена. Сам по себе файл не запускается:
# в разработке его дополняет docker-compose.override.yml, на сервере — docker-compose.prod.yml.
services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: LTM_app
        restart: unless-stopped
        working_dir: /var/www

    # Очередь: конвертация фото блюд в WebP и другие фоновые задачи
    queue:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: LTM_queue
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan queue:work --tries=3 --timeout=120
        depends_on:
            - postgres

    # Реалтайм (Laravel Reverb): кухня, официант, касса
    reverb:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: LTM_reverb
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        depends_on:
            - postgres

    # Планировщик: резервная копия БД раз в сутки (ТЗ 3.1) и другие задачи по расписанию
    scheduler:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: LTM_scheduler
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan schedule:work
        depends_on:
            - postgres

    nginx:
        container_name: LTM_nginx
        restart: unless-stopped
        depends_on:
            - postgres
            - redis

    postgres:
        image: postgres:17
        container_name: LTM_postgres
        restart: unless-stopped
        env_file:
            - docker/.env.data
        volumes:
            - LTM-pgdata:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        container_name: LTM_redis
        restart: unless-stopped
        volumes:
            - LTM-redisdata:/data

volumes:
    LTM-pgdata:
        driver: local
    LTM-redisdata:
        driver: local
