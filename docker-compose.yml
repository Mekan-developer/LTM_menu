
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: tmshop_app  
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www  

  nginx:
    image: nginx:alpine
    container_name: tmshop_nginx
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf    
    depends_on:
      - postgres
      - redis  

  postgres:
    image: postgres:17
    container_name: tmshop_postgres
    restart: unless-stopped
    env_file:
      - docker/.env.data
    volumes:
      - tmshop-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tmshop_redis
    restart: unless-stopped
    volumes:
      - tmshop-redisdata:/data

volumes:
  tmshop-pgdata:
    driver: local
  tmshop-redisdata:
    driver: local  