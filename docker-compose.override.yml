# Разработка: подключается сам при `docker compose up`.
# Код с хоста смонтирован в контейнеры, порты открыты наружу.
services:
    app:
        volumes:
            - .:/var/www

    queue:
        volumes:
            - .:/var/www

    reverb:
        volumes:
            - .:/var/www
        ports:
            - '${REVERB_FORWARD_PORT:-8000}:8080'

    scheduler:
        volumes:
            - .:/var/www

    nginx:
        image: nginx:alpine
        volumes:
            - .:/var/www
            - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
        ports:
            - '${APP_PORT:-8090}:80'

    postgres:
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'

    redis:
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
